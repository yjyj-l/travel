<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 지구본 - 프로토타입</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05070f;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  #globeViz {
    width: 100vw;
    height: 100vh;
  }
  header {
    position: absolute;
    top: 20px;
    left: 24px;
    color: #fff;
    z-index: 10;
    pointer-events: none;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  header p {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin: 4px 0 0;
  }
  .controls {
    position: absolute;
    bottom: 28px;
    left: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  button:hover {
    background: rgba(255,255,255,0.16);
  }
  .caption {
    position: absolute;
    bottom: 28px;
    right: 24px;
    z-index: 10;
    color: #fff;
    text-align: right;
    min-height: 50px;
    transition: opacity 0.3s;
  }
  .caption .city {
    font-size: 22px;
    font-weight: 600;
  }
  .caption .date {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }
  .caption .flag {
    display: block;
    margin-left: auto;
    height: 30px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.25);
    margin-bottom: 6px;
  }
  .plane-marker {
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #d9e2ea 45%, rgba(217,226,234,0) 75%);
    box-shadow: 0 0 10px 3px rgba(217,226,234,0.55), 0 0 22px 9px rgba(217,226,234,0.22);
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    will-change: transform, opacity;
  }
  .plane-trail {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 50%;
    background: #d9e2ea;
    pointer-events: none;
    z-index: 19;
    opacity: 0;
    will-change: transform, opacity;
  }
  .flag-badge {
    position: absolute;
    top: 0;
    left: 0;
    width: 34px;
    height: 46px;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    transform-origin: 50% 17px;
  }
  .flag-badge img {
    display: block;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 2px rgba(238,243,247,0.9), 0 0 14px 3px rgba(238,243,247,0.3), 0 3px 8px rgba(0,0,0,0.55);
  }
  .flag-badge .stem {
    position: absolute;
    left: 17px;
    top: 34px;
    width: 1px;
    height: 12px;
    background: linear-gradient(to bottom, rgba(238,243,247,0.7), rgba(238,243,247,0));
  }
</style>
</head>
<body>

<header>
  <h1>내가 다녀온 여행지 · 지구본</h1>
  <p>샘플 일정 프로토타입 — 서울을 출발해 시간순으로 각 여행지를 향해 날아갑니다.</p>
</header>

<div id="globeViz"></div>

<div class="controls">
  <button id="playBtn">▶ 여정 재생</button>
</div>

<div class="caption" id="caption"></div>
<div class="plane-marker" id="planeMarker"></div>
<div class="plane-trail" id="trail0" style="width:7px;height:7px;"></div>
<div class="plane-trail" id="trail1" style="width:5px;height:5px;"></div>
<div class="plane-trail" id="trail2" style="width:3px;height:3px;"></div>

<script src="https://unpkg.com/globe.gl"></script>
<script>
  const HOME = { name: "서울", lat: 37.5665, lng: 126.9780 };

  const destinations = [
    { name: "프랑스", month: "3월", lat: 48.8566, lng: 2.3522, color: "#b79ad1", iso2: "FR" },
    { name: "포르투갈", month: "5월", lat: 38.7223, lng: -9.1393, color: "#cf9aa3", iso2: "PT" },
    { name: "도쿄", month: "6월", lat: 35.6762, lng: 139.6503, color: "#8fb3d9", iso2: "JP" },
    { name: "제주", month: "7월", lat: 33.4996, lng: 126.5312, color: "#7fbfae", iso2: "KR" },
    { name: "뉴질랜드", month: "8월", lat: -36.8485, lng: 174.7633, color: "#d9c17f", iso2: "NZ" }
  ];

  const SILVER_ACTIVE = "#eef3f7";
  const SILVER_DONE = "#7c8894";

  const points = [
    { name: HOME.name, lat: HOME.lat, lng: HOME.lng, size: 0.5, color: "#f3e9d2" },
    ...destinations.map(d => ({ name: d.name, lat: d.lat, lng: d.lng, size: 0.32, color: d.color }))
  ];

  // one-way legs: home -> each destination, in chronological order
  const legs = destinations.map(d => ({ from: HOME, to: d, dest: d, type: 'out' }));

  const FLIGHT_MS = 4200;
  const PAUSE_MS = 600;

  const globe = Globe()(document.getElementById('globeViz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .backgroundColor('#05070f')
    .showAtmosphere(true)
    .atmosphereColor('#cdd9e4')
    .atmosphereAltitude(0.2)
    .pointsData(points)
    .pointLat('lat')
    .pointLng('lng')
    .pointColor('color')
    .pointAltitude(0.01)
    .pointRadius('size')
    .pointLabel(d => `<div style="font-size:12px;color:#fff;background:rgba(0,0,0,0.6);padding:4px 8px;border-radius:6px;">${d.name}</div>`)
    .arcsData([])
    .arcColor(d => d.phase === 'flying' ? SILVER_ACTIVE : SILVER_DONE)
    .arcAltitude(0.22)
    .arcStroke(d => d.phase === 'flying' ? 0.55 : 0.26)
    .arcDashLength(d => d.dashLen)
    .arcDashGap(0)
    .arcDashAnimateTime(0)
    .ringsData([])
    .ringLat('lat')
    .ringLng('lng')
    .ringColor(() => t => `rgba(238,243,247,${1 - t})`)
    .ringMaxRadius(3.5)
    .ringPropagationSpeed(2.2)
    .ringRepeatPeriod(850)
    .polygonsData([])
    .polygonAltitude(0.006)
    .polygonCapColor(feat => visitedCountries.has(feat.properties.ISO_A2) ? 'rgba(238,243,247,0.32)' : 'rgba(255,255,255,0)')
    .polygonSideColor(() => 'rgba(0,0,0,0)')
    .polygonStrokeColor(feat => visitedCountries.has(feat.properties.ISO_A2) ? 'rgba(238,243,247,0.55)' : 'rgba(255,255,255,0)')
    .polygonsTransitionDuration(700);

  const visitedCountries = new Set();
  let countryFeatures = [];
  fetch('https://cdn.jsdelivr.net/gh/vasturiano/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json())
    .then(geo => {
      countryFeatures = geo.features;
      globe.polygonsData(countryFeatures);
    })
    .catch(() => {});

  globe.pointOfView({ lat: 20, lng: 60, altitude: 2.5 }, 0);

  const controls = globe.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableZoom = true;
  controls.enablePan = false;
  controls.minDistance = 130;
  controls.maxDistance = 700;

  let userInteracted = false;
  controls.addEventListener('start', () => {
    userInteracted = true;
    controls.autoRotate = false;
  });

  const captionEl = document.getElementById('caption');
  const playBtn = document.getElementById('playBtn');
  const markerEl = document.getElementById('planeMarker');
  const trailEls = [document.getElementById('trail0'), document.getElementById('trail1'), document.getElementById('trail2')];

  function showCaption(text, sub, iso2) {
    captionEl.style.opacity = 0;
    setTimeout(() => {
      const flag = iso2 ? `<img class="flag" src="https://flagcdn.com/h60/${iso2.toLowerCase()}.png" alt="${iso2} flag">` : '';
      captionEl.innerHTML = text ? `${flag}<div class="city">${text}</div><div class="date">${sub || ''}</div>` : '';
      captionEl.style.opacity = 1;
    }, 200);
  }

  // -- great-circle interpolation, used to move the glowing marker along the path --
  function toVec(lat, lng) {
    const phi = lat * Math.PI / 180;
    const lam = lng * Math.PI / 180;
    return { x: Math.cos(phi) * Math.cos(lam), y: Math.cos(phi) * Math.sin(lam), z: Math.sin(phi) };
  }
  function toLatLng(v) {
    return {
      lat: Math.asin(Math.max(-1, Math.min(1, v.z))) * 180 / Math.PI,
      lng: Math.atan2(v.y, v.x) * 180 / Math.PI
    };
  }
  function greatCirclePoint(from, to, t) {
    const v0 = toVec(from.lat, from.lng);
    const v1 = toVec(to.lat, to.lng);
    const dot = Math.max(-1, Math.min(1, v0.x*v1.x + v0.y*v1.y + v0.z*v1.z));
    const omega = Math.acos(dot);
    if (omega < 1e-6) return { lat: from.lat, lng: from.lng };
    const s0 = Math.sin((1 - t) * omega) / Math.sin(omega);
    const s1 = Math.sin(t * omega) / Math.sin(omega);
    return toLatLng({ x: v0.x*s0 + v1.x*s1, y: v0.y*s0 + v1.y*s1, z: v0.z*s0 + v1.z*s1 });
  }

  let arcObjects = [];
  let ringObjects = [];
  let flightState = null; // { leg, arcObj, startTime, duration, resolve }
  let trailHistory = [];
  let playing = false;

  function renderMarker(lat, lng, alt) {
    trailHistory.unshift({ lat, lng, alt });
    if (trailHistory.length > 13) trailHistory.length = 13;

    const c = globe.getScreenCoords(lat, lng, alt);
    if (c) {
      markerEl.style.transform = `translate(${c.x}px, ${c.y}px) translate(-50%, -50%)`;
      markerEl.style.opacity = 1;
    } else {
      markerEl.style.opacity = 0;
    }

    const trailIdx = [4, 8, 12];
    trailEls.forEach((el, i) => {
      const p = trailHistory[trailIdx[i]];
      if (!p) { el.style.opacity = 0; return; }
      const tc = globe.getScreenCoords(p.lat, p.lng, p.alt);
      if (tc) {
        el.style.transform = `translate(${tc.x}px, ${tc.y}px) translate(-50%, -50%)`;
        el.style.opacity = 0.5 - i * 0.15;
      } else {
        el.style.opacity = 0;
      }
    });
  }

  function hideMarker() {
    markerEl.style.opacity = 0;
    trailEls.forEach(el => el.style.opacity = 0);
    trailHistory = [];
  }

  function easeOutBack(x) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  let flagBadges = []; // { lat, lng, el, bornAt }
  function addFlagBadge(dest) {
    if (!dest.iso2) return;
    const el = document.createElement('div');
    el.className = 'flag-badge';
    el.innerHTML = `<img src="https://flagcdn.com/w80/${dest.iso2.toLowerCase()}.png" alt="${dest.iso2}"><div class="stem"></div>`;
    document.body.appendChild(el);
    flagBadges.push({ lat: dest.lat, lng: dest.lng, el, bornAt: performance.now() });
  }
  function renderFlagBadges(now) {
    flagBadges.forEach(b => {
      const c = globe.getScreenCoords(b.lat, b.lng, 0.08);
      if (c) {
        const age = Math.min(1, (now - b.bornAt) / 550);
        const scale = age < 1 ? Math.max(0, easeOutBack(age)) : 1;
        b.el.style.transform = `translate(${c.x}px, ${c.y}px) translate(-50%, -100%) scale(${scale})`;
        b.el.style.opacity = 1;
      } else {
        b.el.style.opacity = 0;
      }
    });
  }

  function landingBurst(lat, lng) {
    const ring = { lat, lng };
    ringObjects.push(ring);
    globe.ringsData(ringObjects);
    setTimeout(() => {
      ringObjects = ringObjects.filter(r => r !== ring);
      globe.ringsData(ringObjects);
    }, 1900);
  }

  function tick(now) {
    renderFlagBadges(now);
    if (flightState) {
      const { leg, arcObj, startTime, duration } = flightState;
      const t = Math.min(1, (now - startTime) / duration);
      const pos = greatCirclePoint(leg.from, leg.to, t);
      arcObj.dashLen = Math.max(0.001, t);
      renderMarker(pos.lat, pos.lng, 0.05 + 0.15 * Math.sin(Math.PI * t));
      globe.arcsData(arcObjects);
      if (t >= 1) {
        arcObj.phase = 'done';
        globe.arcsData(arcObjects);
        hideMarker();
        landingBurst(leg.to.lat, leg.to.lng);
        addFlagBadge(leg.dest);
        showCaption(leg.dest.name, `${leg.dest.month} 도착`, leg.dest.iso2);
        if (leg.dest.iso2) {
          visitedCountries.add(leg.dest.iso2);
          if (countryFeatures.length) globe.polygonsData(countryFeatures);
        }
        const resolve = flightState.resolve;
        flightState = null;
        resolve();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function flyLeg(leg) {
    return new Promise(resolve => {
      const midLat = (leg.from.lat + leg.to.lat) / 2;
      const midLng = (leg.from.lng + leg.to.lng) / 2;
      if (!userInteracted) globe.pointOfView({ lat: midLat, lng: midLng, altitude: 2.1 }, FLIGHT_MS * 0.9);

      if (leg.type === 'out') showCaption(leg.dest.name, leg.dest.month);
      else showCaption(`${HOME.name}로 귀국`, leg.dest.month);

      trailHistory = [];
      const arcObj = { startLat: leg.from.lat, startLng: leg.from.lng, endLat: leg.to.lat, endLng: leg.to.lng, phase: 'flying', dashLen: 0.001 };
      arcObjects.push(arcObj);
      globe.arcsData(arcObjects);

      flightState = { leg, arcObj, startTime: performance.now(), duration: FLIGHT_MS, resolve };
    });
  }

  async function playSequence() {
    if (playing) return;
    playing = true;
    playBtn.textContent = '재생 중…';
    arcObjects = [];
    globe.arcsData(arcObjects);
    controls.autoRotate = false;

    for (const leg of legs) {
      await flyLeg(leg);
      await new Promise(r => setTimeout(r, PAUSE_MS));
    }

    showCaption(null);
    if (!userInteracted) {
      globe.pointOfView({ lat: 20, lng: 60, altitude: 2.5 }, 1500);
      controls.autoRotate = true;
    }
    playBtn.textContent = '▶ 다시 재생';
    playing = false;
  }

  playBtn.addEventListener('click', playSequence);
  setTimeout(playSequence, 1300);
</script>

</body>
</html>
